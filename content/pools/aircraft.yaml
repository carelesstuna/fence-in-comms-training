# Flugzeuge – die einzige Quelle der Flugzeugliste.
# Genutzt für: Auswahl im Profil (gruppiert nach Epoche, gefiltert nach Sims), Flugzeug-Kästen
# (:::aircraft{aircraft=f16} oder mit Liste p51,p47), Epochen-Kästen (:::era) und den Würfelpool
# (Variable: { pool: aircraft, where: { service: usn, era: modern } }).
#
# Regel (docs/content-plan/flugzeuge-und-epochen.md): Ein eigener Eintrag nur für Muster, die in DCS,
# BMS oder IL-2 fliegbar sind und sich im Funk spürbar unterscheiden (Gerät, Besatzung mit Intercom,
# eigenes Verfahren). Alles andere steht im Sammel-Eintrag der Epoche (group: true, nie gewürfelt).
# Funkgeräte laut Recherche 07 (DCS-VoIP-Dateien, Modul-Handbücher, BMS-Handbücher).
#
# Felder: id, label (Anzeige), type (im Text), radio (Rufname im Funk, z. B. „Hornet ball“), era
# (ww2 | cold-war | modern), sims, nation, service, seats, role, radios (nur Anzeige), group, note.
# Die Reihenfolge innerhalb einer Epoche ist die Reihenfolge im Profil.

