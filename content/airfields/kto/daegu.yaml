notes:
  - "Frequenzen laut BMS-Simdaten (Stations+Ils.dat, Stand BMS 4.38) und BMS-AGC: ATC nur auf UHF, ATIS nur auf VHF; Approach und Departure teilen sich eine Frequenz. Das VHF in `atc` ist der Tower auf VHF."
  - "TACAN weggelassen: AGC nennt DOC 112X, die AIP-Platztabelle 125X. ILS weggelassen: die Simdaten führen mehrere Frequenzen ohne klare Zuordnung zu den Bahnenden."
  - "Die echte Visual-Karte nennt andere Approach- und Tower-Frequenzen als die BMS-AGC; hier zählen die BMS-Werte."
  - "Funkname ohne „AB“, wie ihn die BMS-ATC spricht („Daegu Ground“, vgl. Comms & Nav Book 4.38.2: „Gunsan Approach, Falcon 1 …“). Die BMS-Karten führen den Platz als „Daegu AB“."
