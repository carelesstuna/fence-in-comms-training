notes:
  - "Die BMS-ATC spricht „Gunsan“; im Alltag und in echten Quellen heißt der Platz „Kunsan“."
  - "Frequenzen laut BMS-Simdaten (Stations+Ils.dat, Stand BMS 4.38) und BMS-AGC: ATC nur auf UHF, ATIS nur auf VHF; Approach und Departure teilen sich eine Frequenz. Das VHF in `atc` ist der Tower auf VHF."
  - "Base Ops (UHF 304.8) steht nur in den Simdaten und der EOR-Karte, nicht im Schema. TACAN KUZ 75X laut AGC und Comms & Nav Book."
  - "Platzhöhe 22 ft laut BMS-AGC; die EOR-Karte nennt 10 ft, das Comms & Nav Book ebenfalls 10 ft. Echte Frequenzen (AIP) liegen nicht eindeutig vor, daher kein realFreqs."
  - "Pattern in BMS immer über See. Sechs EOR-Parkplätze je Bahnende (EOR-Karte, Stand 2022)."
  - "Funkname ohne „AB“, wie ihn die BMS-ATC spricht („Gunsan Ground“, vgl. Comms & Nav Book 4.38.2: „Gunsan Approach, Falcon 1 …“). Die BMS-Karten führen den Platz als „Gunsan AB“."
