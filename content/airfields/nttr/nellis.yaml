notes:
  - Direkt neben dem Class-B-Luftraum von Las Vegas – Ab- und Anflüge über festgelegte Punkte.
  - Sehr großes Vorfeld (über 200 Abstellplätze), viel Verkehr in Multiplayer-Missionen.
  - TACAN Kanal 12 (LSV) und Localizer I-DIQ 109.10 laut DCS-Funkfeuerdaten (Mods/terrains/Nevada/Beacons.lua) und Anflugkarte („Chan 12“). Ein Y-Modus steht nirgends, daher X.
  - Platzhöhe 1869 ft laut mitgelieferter FAA-Karte; das DCS-Gelände liegt an TACAN und Gleitpfadsender bei rund 1850 ft.
