# Abzeichen (Achievements). Jedes hat genau eine Bedingung (rule). Mögliche Bedingungen:
#   lessons: n          n Lektionen abgeschlossen
#   module: m1          Modul erledigt (auch per Einstufung)
#   placement: true     einen Einstufungstest bestanden
#   exams: n            n Modulprüfungen bestanden
#   rank: wingman       Dienstgrad erreicht
#   xp: n               n XP gesammelt
#   streak: n           Funk-Drill n Tage in Folge (Rekord zählt)
#   dailyDays: n        Funk-Drill an n Tagen erledigt (insgesamt)
#   matureCards: n      n Übungen im Langzeitgedächtnis (Wiederholungsabstand ab 21 Tagen)
#   hangar: n           n Hangar-Karten entdeckt
#   correctCalls: n     n Funksprüche richtig getippt
#   cleanCalls: n       n Funksprüche richtig und ohne ein überflüssiges Wort
#   silences: n         n-mal richtig geschwiegen
#   tunes: n            n-mal das Funkgerät auf Anhieb richtig eingestellt
#   perfectScenarios: n n Szenarien ohne Fehler
# hidden: true = geheim, bis es erreicht ist.

