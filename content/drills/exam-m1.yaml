# Prüfungsfragen für Modul 1 (Modulprüfung, S-15). Alle Übungen hier haben exam: true und kommen in keiner Lektion vor.
# Die Lektion steht am Anfang der ID (m1-l3-x-… gehört zu m1-l3). Weitere Prüfungsfragen für Modul 1 sind Übungen in
# m1.yaml, die ebenfalls exam: true tragen (früher in keiner Lektion eingebunden).
# Produktion (U2-01): Die Prüfung soll auch Funksprüche tippen lassen – Erstanruf, Readback, Radio Check. Diese Übungen
# stehen unten mit dem Kommentar „Produktion“ (dazu m1-l4-build-check in m1.yaml).

# ------------------------------------------------------------ Lektion 1: Wer ruft wen?
- id: m1-l1-x-order-call
  type: choice
  exam: true
  vars:
    airfield: { pool: airfields }
  prompt: Du rufst {airfield.name} Ground zum ersten Mal und willst rollen. Welcher Funkspruch hat den richtigen Aufbau?
  options:
    - "{airfield.name} Ground, {callsign|spoken}, request taxi"
    - "{callsign|spoken}, {airfield.name} Ground, request taxi"
    - "Request taxi, {airfield.name} Ground, {callsign|spoken}"
    - "{airfield.name} Ground, request taxi, {callsign|spoken}"
  answer: 0
  explain: >-
    Erst der Adressat (wen rufe ich?), dann dein Rufzeichen (wer bin ich?), dann die Nachricht (was will ich?).

- id: m1-l1-x-reply
  type: choice
  exam: true
  vars:
    airfield: { pool: airfields }
  prompt: >-
    Du hast {airfield.name} Tower gerufen, und der Tower antwortet dir. Wie beginnt seine Antwort?
  options:
    - Mit deinem Rufzeichen – jetzt bist du der Adressat.
    - Mit „Tower“ und dem eigenen Namen, so wie du ihn gerufen hast.
    - Mit der Nachricht selbst, das Rufzeichen kann der Tower weglassen.
    - Mit „roger“, danach erst die Nachricht.
  answer: 0
  explain: >-
    Die Regel dreht sich nicht um, sie gilt für beide Seiten: Wer antwortet, nennt zuerst den Adressaten, und das bist jetzt
    du. Lotsen kürzen oft ihren eigenen Namen, du nennst dagegen immer dein Rufzeichen.

# Produktion: Erstanruf tippen
- id: m1-l1-x-call-radio-check
  type: call
  exam: true
  call: m1-radio-check
  situation: Du sitzt startbereit im Cockpit.
  prompt: Prüfe beim Tower, ob man dich hört, und nenn die Frequenz am Ende.
  explain: >-
    „{airfield.name} Tower, {callsign|spoken}, radio check, {airfield.twr|spoken}.“ Adressat, Rufzeichen, Anliegen. Die
    Frequenz am Ende hilft dem Tower, wenn du mehrere Funkgeräte hast.

# ------------------------------------------------------------ Lektion 2: Alfa, Bravo, Charlie
- id: m1-l2-x-spell
  type: generated
  exam: true
  generator: phonetic-spell

# ------------------------------------------------------------ Lektion 4: Rufzeichen und Flights
# Produktion: Erstanruf als Lead für den ganzen Flight tippen
- id: m1-l4-x-call-taxi
  type: call
  exam: true
  call: m1-taxi-request
  transmission: 0
  situation: >-
    Dein Flight hat **zwei** Flugzeuge. Ihr steht angelassen auf dem Vorfeld, die ATIS-Ausgabe ist
    **{atis.letter}**.
  prompt: Bitte Ground ums Rollen.
  explain: >-
    „{airfield.name} Ground, {callsign|spoken}, flight of two, information {atis}, request taxi.“ Als Lead sprichst du
    für beide: mit deinem eigenen Rufzeichen und der Zahl der Flugzeuge. Dein Wingman hört mit und schweigt.

# ------------------------------------------------------------ Lektion 7 (Position 5): Funk und Physik
- id: m1-l7-x-quad
  type: choice
  exam: true
  vars:
    # text = Ausgangshöhe, spoken = die vierfache Höhe
    h: { oneOf: [{ text: "400", spoken: "1.600" }, { text: "900", spoken: "3.600" }, { text: "2.500", spoken: "10.000" }] }
  prompt: >-
    Ein Flugzeug steigt von {h} ft auf {h|spoken} ft, also auf die vierfache Höhe. Wie ändert sich ungefähr der
    Funkhorizont zu einer Bodenstation?
  options:
    - Er verdoppelt sich ungefähr.
    - Er vervierfacht sich.
    - Er wächst nur um ein Viertel.
    - Er bleibt gleich, denn nur die Sendeleistung zählt.
  answer: 0
  explain: >-
    Der Merksatz: vierfache Höhe, doppelte Reichweite (in der Faustformel steht die Höhe unter einer Wurzel, √4 = 2).
    Die Sendeleistung verschiebt den Horizont nicht.

- id: m1-l7-x-bands
  type: choice
  exam: true
  prompt: >-
    Du willst über dem Ozean weit über den Horizont funken, weit weg von jeder Station in Sichtlinie. Welches Band kommt dafür in
    Frage, und warum?
  options:
    - "Kurzwelle (HF): Die Ionosphäre wirft sie zur Erde zurück."
    - "UHF: Je höher die Frequenz, desto weiter trägt sie über den Horizont."
    - "VHF: Sie folgt der Erdkrümmung und trägt deshalb über den Horizont."
    - "Keines: Im Flugfunk trägt jedes Band gleich weit."
  answer: 0
  explain: >-
    VHF und UHF laufen fast geradeaus und enden am Funkhorizont. Nur Kurzwelle trägt weiter, weil die Ionosphäre sie
    zurückwirft. Deshalb nutzt man sie über Ozeanen und in abgelegenen Gebieten.

- id: m1-l7-x-am-fm
  type: choice
  exam: true
  vars:
    f: { number: vhf-fm }
  prompt: >-
    Der JTAC sendet auf FM, du hast dein Gerät auf dieselbe Frequenz {f|spoken} gestellt, aber auf AM. Was hörst du?
  options:
    - Nichts Verständliches, egal wie nah er ist.
    - Seine Stimme, etwas leiser, aber gut verständlich.
    - Seine Stimme mit einem Pfeifton darunter.
    - Erst schlecht lesbar, bei Annäherung immer besser.
  answer: 0
  explain: >-
    Gleiche Frequenz mit falscher Modulation heißt kein Kontakt. Ein Empfänger versteht nur die Modulation, auf die er
    eingestellt ist. Die Frequenz allein genügt nicht, und die Entfernung ändert daran nichts.

- id: m1-l7-x-squelch
  type: choice
  exam: true
  prompt: Was macht die Rauschsperre (Squelch) im Funkgerät?
  options:
    - Sie hält den Empfänger stumm, solange kein Signal anliegt.
    - Sie verstärkt schwache Signale, damit sie lesbar werden.
    - Sie filtert Stationen auf Nachbarfrequenzen heraus.
    - Sie begrenzt die Sendeleistung, wenn du zu laut sprichst.
  answer: 0
  explain: >-
    Ohne Rauschsperre hörst du dauernd Rauschen. Sie lässt den Empfänger schweigen, bis ein Signal ankommt. Schwache Signale
    macht sie nicht besser. Ist sie zu hoch eingestellt, schneidet sie schwache Stationen sogar ganz weg.

- id: m1-l7-x-two-aircraft
  type: choice
  exam: true
  vars:
    # text = Flughöhe, spoken = Merkwert zu einer Antenne am Boden (Tabelle in Modul 1, Lektion 5)
    alt: { oneOf: [{ text: "1.000", spoken: "40" }, { text: "5.000", spoken: "90" }, { text: "10.000", spoken: "120" }] }
  prompt: >-
    Ein Flugzeug auf {alt} ft erreicht eine Antenne am Boden etwa {alt|spoken} NM weit. Wie weit können sich zwei
    Flugzeuge hören, die beide auf {alt} ft fliegen?
  options:
    - "Etwa doppelt so weit – die Reichweiten beider Antennen zählen zusammen."
    - "Genauso weit wie zu einer Antenne am Boden, also etwa {alt|spoken} NM."
    - "Nur etwa halb so weit, weil sich zwei Sender in der Luft gegenseitig stören."
    - "Beliebig weit, denn zwischen zwei Flugzeugen gibt es keinen Horizont."
  answer: 0
  explain: >-
    Jede Antenne bringt ihren eigenen Horizont mit, und die Strecken addieren sich: zweimal {alt|spoken} NM. Zwei
    Flugzeuge in der Luft hören sich deshalb deutlich weiter als eines eine Bodenstation.

# ------------------------------------------------------------ Lektion 7 (ID m1-l6): Readback und Radio Check
# Produktion: Readbacks tippen, Radio Check mit Lesbarkeit beantworten
- id: m1-l6-x-call-approach-readback
  type: call
  exam: true
  call: m1-approach-numbers
  transmission: 1
  situation: Du kommst zurück zum Platz. Approach gibt dir eine Anweisung.
  prompt: Lies sie zurück.
  explain: >-
    „{altim.word} {altim|spoken}, left heading {hdg|spoken}, {airfield.descend} {alt|spoken}, {callsign|spoken}.“ Alle
    drei Zahlen, beim Kurs die Drehrichtung, dein Rufzeichen am Ende. „roger“ oder „wilco“ allein wären zu wenig. In
    {airfield.name} gilt die {airfield.phraseology.here}.

- id: m1-l6-x-call-taxi-readback
  type: call
  exam: true
  call: m1-taxi-request
  transmission: 2
  situation: Du stehst angelassen auf dem Vorfeld und hast Ground um die Rollfreigabe gebeten.
  prompt: Lies die Freigabe zurück.
  explain: >-
    „runway {airfield.runway|spoken}, via {twA}, {twB}, hold short of runway {airfield.runway|spoken},
    {callsign|spoken}.“ Die Runway, der Rollweg in derselben Reihenfolge, „hold short“ wörtlich und dein Rufzeichen
    am Ende.

- id: m1-l6-x-input-readability
  type: input
  exam: true
  # Hörprobe: Der Tower klingt so, wie die Aufgabe sagt
  call: m1-radio-check-incoming
  vars:
    airfield: { pool: airfields }
    unit: { oneOf: [Tower] }
    # text = wie gut du den Tower verstehst (Anzeige), spoken = Stufe der Lesbarkeitsskala (Antwort)
    rd: { oneOf: [{ text: "einwandfrei", spoken: five }, { text: "gut", spoken: four }, { text: "nur mit Mühe", spoken: three }] }
  prompt: >-
    {airfield.name} Tower hat ein neues Funkgerät und prüft es mit dir: „{callsign|spoken}, {airfield.name} Tower,
    radio check.“ Du verstehst ihn **{rd}**. Antworte mit Adressat, Rufzeichen und der Stufe der Lesbarkeitsskala.
  accept:
    - "{airfield.name} tower {callsign|spoken} read you {rd|spoken}"
    - "{airfield.name} tower {callsign|spoken} reading you {rd|spoken}"
  explain: >-
    „{airfield.name} Tower, {callsign|spoken}, read you {rd|spoken}.“ Die Skala: 5 einwandfrei, 4 gut lesbar, 3 nur mit
    Mühe, 2 zeitweise, 1 unlesbar. Militärisch hörst du bei 5 auch „loud and clear“.
