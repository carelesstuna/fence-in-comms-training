[package]
name = "fence-in-comms-training"
version = "0.2.0"
description = "Lern-App für militärischen Flugfunk für Flugsim-Piloten"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "fence_in_comms_training_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Externe Links (Quellenangaben) im Systembrowser öffnen; Rust ruft es selbst auf, die Seite bekommt keine Rechte dafür
tauri-plugin-opener = "=2.7.3"
# Modelle der Spracherkennung auf Klick nachladen (HTTPS) und prüfen
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
sha2 = "=0.11.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
