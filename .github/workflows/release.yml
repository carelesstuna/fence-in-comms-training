# Windows installer.
# - Every push to main: build as a test, the installer is kept as a workflow artifact for 30 days.
# - Version tag (v*): build, attest where it came from and create a release *draft*.
#   Publishing the draft stays a manual click on GitHub.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Speech recognition: whisper.cpp built with Vulkan (graphics card, falls back to the CPU),
  # statically linked against the C runtime and without OpenMP – no Visual C++ runtime needed.
  WHISPER_VERSION: v1.9.5
  WHISPER_COMMIT: d1be6fde11ac6e0407606b4e42fe72d34add8037
  VULKAN_SDK_VERSION: 1.4.363.1
  VULKAN_SDK_SHA256: c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.Substring(1)
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $tauri -or $tag -ne $npm) { throw "Tag $tag does not match tauri.conf.json ($tauri) / package.json ($npm)" }

      - name: Cache whisper.cpp build
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .asr/whisper.cpp/v1.9.5-vulkan
          key: whisper-${{ env.WHISPER_COMMIT }}-vulkan${{ env.VULKAN_SDK_VERSION }}-mt-noopenmp-1

      - name: Install Vulkan SDK
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK checksum mismatch: $hash" }
          $root = 'C:\VulkanSDK'
          $p = Start-Process $exe -ArgumentList '--root', $root, '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installation failed ($($p.ExitCode))" }
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw 'glslc.exe missing after Vulkan SDK installation' }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV

      - name: Build whisper.cpp with Vulkan
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:WHISPER_VERSION https://github.com/ggml-org/whisper.cpp C:\wsrc
          $head = git -C C:\wsrc rev-parse HEAD
          if ($head -ne $env:WHISPER_COMMIT) { throw "whisper.cpp $env:WHISPER_VERSION is $head, expected $env:WHISPER_COMMIT" }
          cmake -S C:\wsrc -B C:\wbuild -A x64 `
            -DBUILD_SHARED_LIBS=ON -DWHISPER_SDL2=OFF -DWHISPER_BUILD_TESTS=OFF `
            -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_VULKAN=ON -DGGML_OPENMP=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build C:\wbuild --config Release -j 4
          if ($LASTEXITCODE -ne 0) { throw 'whisper.cpp build failed' }
          $bin = (Get-ChildItem C:\wbuild -Recurse -Filter whisper-cli.exe | Select-Object -First 1).DirectoryName
          $out = '.asr\whisper.cpp\v1.9.5-vulkan'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item (Join-Path $bin 'whisper-cli.exe'), (Join-Path $bin '*.dll') $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Check whisper.cpp needs no Visual C++ runtime
        run: |
          $dir = '.asr\whisper.cpp\v1.9.5-vulkan'
          foreach ($f in 'whisper-cli.exe', 'whisper.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-vulkan.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f missing" }
          }
          $bad = Get-ChildItem $dir -File | Where-Object {
            [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($_.FullName)) -match '(?i)vcruntime140|msvcp140|vcomp140'
          }
          if ($bad) { throw "Depends on the Visual C++ runtime: $($bad.Name -join ', ')" }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci

      - name: Build installer
        env:
          RT_ASR_DIR: ${{ github.workspace }}\.asr
        run: |
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          npm run desktop:build
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: built

      - name: Name files without spaces and write checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir -p release
          cp built/*-setup.exe "release/Fence-In-Comms-Training_${version}_x64-setup.exe"
          (cd release && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.exe

      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # What's new: the section of this version in CHANGELOG.md ("## 0.2.0 – …" up to the next version)
          awk -v v="$version" 'index($0, "## " v " ") == 1 || $0 == "## " v {f = 1; next} /^## / && f {exit} f' CHANGELOG.md | sed '/./,$!d' > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "_No CHANGELOG.md section for ${version} – describe the changes here before publishing this draft._" > changes.md
          fi
          awk 'FNR == NR {c = c $0 "\n"; next} $0 == "{{CHANGES}}" {printf "%s", c; next} {print}' changes.md .github/release-notes.md \
            | sed "s/{{VERSION}}/${version}/g" > notes.md
          cat notes.md
          gh release create "$TAG" --draft --verify-tag \
            --title "Fence In Comms Training ${version}" --notes-file notes.md \
            release/*.exe release/SHA256SUMS.txt
